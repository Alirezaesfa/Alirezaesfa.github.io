<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Geist"; src: url("/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/fonts/GeistMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
:root { color-scheme: light; --bg: #f5f6f8; --surface: #ffffff; --line: #e3e7ed; --ink: #0d1625; --muted: #475467; --faint: #5b687b; --accent: #1a63d6; --accent-ink: #ffffff; --signal: #b45309; --glow: rgba(26, 99, 214, .09); --dot: rgba(15, 23, 42, .08); --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px -8px rgba(16, 24, 40, .12); }
:root[data-theme="dark"] { color-scheme: dark; --bg: #07090d; --surface: #0d1219; --line: #19212d; --ink: #e8ecf2; --muted: #9ea8b9; --faint: #8792a5; --accent: #5aa9ff; --accent-ink: #04101d; --signal: #ffb547; --glow: rgba(90, 169, 255, .12); --dot: rgba(255, 255, 255, .05); --shadow: none; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 20px; background-color: var(--bg); color: var(--ink);
  font: 400 1rem/1.6 "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background-image: radial-gradient(640px 400px at 20% 0%, var(--glow), transparent 70%), radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: auto, 18px 18px; }
.box { width: 100%; max-width: 560px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.bar { padding: 12px 18px; border-bottom: 1px solid var(--line); font: .75rem "Geist Mono", ui-monospace, monospace; color: var(--faint); }
.in { padding: 28px 24px 30px; }
.code { font: .875rem/1.7 "Geist Mono", ui-monospace, monospace; color: var(--muted); }
.code b { color: var(--signal); font-weight: 400; }
h1 { margin: 18px 0 8px; font-size: clamp(1.75rem, 5vw, 2.25rem); letter-spacing: -.035em; line-height: 1.1; }
p { margin: 0; color: var(--muted); }
a { display: inline-flex; margin-top: 22px; padding: 10px 18px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-weight: 500; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>

  </div>
</main>
</body>
